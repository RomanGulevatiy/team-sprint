name: Java CI
on:
  push:
    branches:
      - master
      - dev
      - feature/*
      - bugfix/*
      - refactor/*

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Grant execute permission to mvnw
        run: chmod +x mvnw

      - name: Build and test with Maven
        run: ./mvnw clean verify
